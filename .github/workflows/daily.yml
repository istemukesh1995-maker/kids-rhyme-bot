name: Daily Rhyme Video

on:
  schedule:
    - cron: "30 3 * * *"   # रोज सकाळी 9:00 IST
  workflow_dispatch:        # हाताने Run करण्यासाठी

jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core libraqm0
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Make and upload video
        run: python main.py
        env:
          RHYME_LANG: english        # english / hindi / marathi
          PRIVACY: private           # public करण्यासाठी बदला
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/final.mp4
